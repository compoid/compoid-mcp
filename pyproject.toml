[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compoid-mcp"
version = "0.1.1"
description = "MCP Server for Compoid AI repository"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Compoid", email = "admin@compoid.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # mcp 2.x removed mcp.server.fastmcp (v1 FastMCP); keep v1 SDK
    "mcp>=1.0.0,<2.0.0",
    # third-party FastMCP (get_http_headers); 3.x/4.x changed module layout
    "fastmcp>=2.14.3,<3",
    "jinja2>=3.1.0",
    "httpx>=0.28.1",
    "pydantic>=2.0.0",
    "requests>=2.32.5",
    "anyio>=3.0.0"
]

[project.urls]
Homepage = "https://www.compoid.com"
Repository = "https://github.com/compoid/compoid-mcp"
Issues = "https://github.com/compoid/compoid-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.6",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "mcp[cli]>=1.10.1,<2.0.0",
    "pydantic>=2.0.0",
    "fastmcp==2.14.3",
    "numpy>=2.2.5",
    "ffmpeg-python==0.2.0",
    "pillow>=11.2.1",
    "python-pptx>=1.0.2",
    "python-dotenv>=1.2.1",
    "starlette>=0.50.0",
    "uvicorn>=0.40.0",
    "jinja2>=3.1.6",
    
    # File Processing
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "fastapi>=0.128.0",
    
    # Data Processing
    "pyyaml>=6.0.0",
    "python-frontmatter>=1.1.0",
    "markdown>=3.5.0",
    "pdftotext>=4.0.0",
    
    # Async Support
    "aiofiles>=23.0.0",
    "asyncio-throttle>=1.0.2",
    
    # Utilities
    "pathlib-mate>=1.2.0",
    "python-dateutil>=2.8.0",
    "typing-extensions>=4.8.0",

]

[project.scripts]
compoid-mcp = "compoid_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compoid_mcp = ["templates/*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
